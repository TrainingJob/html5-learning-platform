const REPORT={"sourceDate": "2026-10-22", "source": "https://html.spec.whatwg.org/multipage/indices.html", "uniqueTotal": 113, "categoryCounts": [["文件結構", 3], ["Metadata", 8], ["語意化結構", 10], ["標題與文字", 16], ["清單", 7], ["超連結", 4], ["圖片與圖像", 8], ["多媒體", 4], ["表格", 10], ["表單", 15], ["互動元件", 10], ["嵌入內容", 7], ["程式與範本", 5], ["其他文字語意", 26]], "categoryMembershipSum": 133, "multiCategoryUniqueElements": 18, "extraMemberships": 20, "multiCategoryItems": [{"tagName": "a", "categories": ["超連結", "互動元件"]}, {"tagName": "area", "categories": ["超連結", "圖片與圖像"]}, {"tagName": "audio", "categories": ["多媒體", "互動元件", "嵌入內容"]}, {"tagName": "b", "categories": ["標題與文字", "其他文字語意"]}, {"tagName": "button", "categories": ["表單", "互動元件"]}, {"tagName": "canvas", "categories": ["圖片與圖像", "程式與範本"]}, {"tagName": "img", "categories": ["圖片與圖像", "嵌入內容"]}, {"tagName": "input", "categories": ["表單", "互動元件"]}, {"tagName": "map", "categories": ["超連結", "圖片與圖像"]}, {"tagName": "nav", "categories": ["語意化結構", "超連結"]}, {"tagName": "noscript", "categories": ["Metadata", "程式與範本"]}, {"tagName": "picture", "categories": ["圖片與圖像", "嵌入內容"]}, {"tagName": "script", "categories": ["Metadata", "程式與範本"]}, {"tagName": "select", "categories": ["表單", "互動元件"]}, {"tagName": "source", "categories": ["圖片與圖像", "多媒體"]}, {"tagName": "template", "categories": ["Metadata", "程式與範本"]}, {"tagName": "textarea", "categories": ["表單", "互動元件"]}, {"tagName": "video", "categories": ["多媒體", "互動元件", "嵌入內容"]}], "notConfirmedAsStandard": [], "detailsPending": ["abbr", "address", "area", "b", "bdi", "bdo", "blockquote", "br", "canvas", "cite", "code", "col", "colgroup", "data", "datalist", "del", "dfn", "embed", "fieldset", "hgroup", "hr", "i", "ins", "kbd", "legend", "map", "mark", "menu", "meter", "noscript", "object", "optgroup", "output", "pre", "progress", "q", "rp", "rt", "ruby", "s", "samp", "small", "sub", "sup", "tbody", "tfoot", "thead", "time", "u", "var", "wbr"], "exclusions": ["DOCTYPE", "SVG svg", "MathML math", "autonomous custom elements", "HTML attributes", "input types", "obsolete elements"]};
const CAT=REPORT.categoryCounts.map(x=>x[0]);
const $=s=>document.querySelector(s);let category='全部',tab='list',q='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#total').textContent=REPORT.uniqueTotal;$('#duplicates').textContent=REPORT.multiCategoryUniqueElements;$('#pending').textContent=REPORT.detailsPending.length;
function catRender(){let counts=[['全部',ELEMENTS.length],...REPORT.categoryCounts];$('#categories').innerHTML=counts.map(([c,n])=>`<button class="category ${category===c?'active':''}" data-cat="${esc(c)}"><span>${esc(c)}</span><b>${n}</b></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;tab='list';activate();}));}
function activate(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));catRender();if(tab==='list')listing();if(tab==='report')reporting();if(tab==='editor')editing();if(tab==='notes')notes();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;activate()});
function listing(){
  $('#content').innerHTML=`<div class="toolbar"><label for="query" class="tiny">搜尋元素</label><input type="search" id="query" placeholder="搜尋元素、用途或分類" value="${esc(q)}"><span class="tiny" id="resultsCount" aria-live="polite"></span><button class="secondary" id="csv">下載 CSV</button><button class="secondary" id="json">下載 JSON</button></div><div class="cards" id="resultsCards"></div><p class="empty" id="emptyResults" hidden>查無符合的元素。</p>`;
  function refresh(){const list=ELEMENTS.filter(e=>(category==='全部'||e.categories.includes(category))&&(`${e.tagName} ${e.description} ${e.categories.join(' ')}`.toLowerCase().includes(q.toLowerCase())));
    $('#resultsCount').textContent=`顯示 ${list.length} 個元素`;
    $('#resultsCards').innerHTML=list.map(e=>`<article class="element"><code>&lt;${esc(e.tagName)}&gt;</code><p>${esc(e.description)}</p><div>${e.categories.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}${e.detailStatus!=='已編寫簡介'?'<span class="pill warning">待擴充範例</span>':''}</div><button class="secondary" data-detail="${esc(e.tagName)}">查看語法／來源</button></article>`).join('');
    $('#emptyResults').hidden=!!list.length;
    document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showElement(b.dataset.detail));
  }
  const field=$('#query');let composing=false;
  field.addEventListener('compositionstart',()=>{composing=true});
  field.addEventListener('compositionend',()=>{composing=false;q=field.value;refresh()});
  field.addEventListener('input',()=>{if(!composing){q=field.value;refresh()}});
  $('#csv').onclick=()=>download('html-elements.csv',csv(),'text/csv;charset=utf-8');
  $('#json').onclick=()=>download('html-elements.json',JSON.stringify(ELEMENTS,null,2),'application/json');
  refresh();
}
function showElement(tag){let e=ELEMENTS.find(x=>x.tagName===tag);$('#content').innerHTML=`<button class="secondary" id="back">← 返回元素清單</button><h2>&lt;${e.tagName}&gt;</h2><p>${esc(e.description)}</p><p>${e.categories.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</p><h3>HTML 語法參考</h3><pre>${esc(e.example)}</pre><p class="tiny">${e.detailStatus==='待擴充專屬範例'?'此項僅供標籤位置與寫法參考，不代表已驗證該元素的完整合法內容模型。請核對官方文件。':'範例僅為教學片段，部分需要合適的父元素、外部媒體或執行環境。'}</p><div class="row"><button class="primary" id="practice">帶入編輯器</button><button class="secondary" id="copy">複製程式</button><a class="secondary link" target="_blank" rel="noopener" href="${e.source}">WHATWG 索引</a><a class="secondary link" target="_blank" rel="noopener" href="${e.mdn}">MDN 文件（需核對）</a></div>`;$('#back').onclick=listing;$('#copy').onclick=async()=>{try{if(!navigator.clipboard?.writeText)throw Error('剪貼簿 API 不可用');await navigator.clipboard.writeText(e.example);$('#copy').textContent='已複製';}catch(_){window.prompt('請選取以下程式碼並手動複製',e.example);}};$('#practice').onclick=()=>{tab='editor';activate();$('#htmlcode').value=e.example;run()};}
function reporting(){let rows=REPORT.categoryCounts.map(([c,n])=>`<div class="countrow"><span>${esc(c)}</span><b>${n}</b></div>`).join('');let repeated=REPORT.multiCategoryItems.map(e=>`<tr><td><code>&lt;${e.tagName}&gt;</code></td><td>${esc(e.categories.join('、'))}</td></tr>`).join('');$('#content').innerHTML=`<h2>分類數量與去重報告</h2><p>唯一元素 <b>${REPORT.uniqueTotal}</b>；分類歸屬總筆數 <b>${REPORT.categoryMembershipSum}</b>；跨類元素 <b>${REPORT.multiCategoryUniqueElements}</b>；超出唯一元素的額外分類歸屬 <b>${REPORT.extraMemberships}</b>。</p><h3>各功能類別</h3>${rows}<h3>跨多類的元素（${REPORT.multiCategoryItems.length} 個）</h3><div style="overflow:auto"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>標籤</th><th>教學分類</th></tr></thead><tbody>${repeated}</tbody></table></div><hr class="line"><h3>待補專屬教學範例（${REPORT.detailsPending.length} 個）</h3><p class="tiny">${esc(REPORT.detailsPending.join('、'))}</p><button class="secondary" id="rep">下載統計 JSON</button>`;$('#rep').onclick=()=>download('html-report.json',JSON.stringify(REPORT,null,2),'application/json');}
function editing(){let h=window.savedHTML??'<h1>HTML5 學習平台</h1>\n<p>修改程式後按「執行預覽」。</p>\n<button id="btn">互動按鈕</button>';let c=window.savedCSS??'body { font-family: sans-serif; padding: 22px; }\nh1 { color: teal; }';let j=window.savedJS??'document.getElementById("btn")?.addEventListener("click", () => alert("JavaScript 已執行"));';$('#content').innerHTML=`<h2>HTML／CSS／JavaScript 練習</h2><p class="tiny">程式在 sandbox iframe 執行。此為本機學習環境，勿輸入金鑰或貼入不可信的外部腳本。</p><div class="editorgrid"><div><label for="htmlcode">HTML</label><textarea id="htmlcode" spellcheck="false">${esc(h)}</textarea></div><div><label for="csscode">CSS</label><textarea id="csscode" spellcheck="false">${esc(c)}</textarea></div><div class="wide"><label for="jscode">JavaScript</label><textarea id="jscode" spellcheck="false" style="min-height:110px">${esc(j)}</textarea></div></div><div class="row" style="margin:14px 0"><button class="primary" id="run">▶ 執行預覽</button><button class="secondary" id="reset">重設</button><button class="secondary" id="export">下載練習 HTML</button></div><iframe id="preview" title="隔離的程式預覽" sandbox="allow-scripts"></iframe>`;$('#run').onclick=run;$('#reset').onclick=()=>{window.savedHTML=window.savedCSS=window.savedJS=undefined;editing()};$('#export').onclick=()=>download('my-practice.html',doc(),'text/html;charset=utf-8');run();}
function doc(){let h=$('#htmlcode').value,c=$('#csscode').value,j=$('#jscode').value;window.savedHTML=h;window.savedCSS=c;window.savedJS=j;let endStyle='<'+'/style>',endScript='<'+'/script>';return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+c.replace(/<\/style/gi,'<\\/style')+endStyle+'</head><body>'+h+'<script>'+j.replace(/<\/script/gi,'<\\/script')+endScript+'</body></html>';}

function run(){$('#preview').srcdoc=doc()}
function notes(){$('#content').innerHTML=`<h2>資料定義與確認範圍</h2><p>本資料集逐項整理自 WHATWG HTML Living Standard「Index → Elements」列出的符合規範 HTML 標籤，索引版本日期為 <b>${REPORT.sourceDate}</b>。排除 SVG 根元素、MathML 根元素、作者自訂元素、DOCTYPE、HTML 屬性、input type 類型及淘汰標籤。</p><p><b>唯一元素 ${REPORT.uniqueTotal} 個</b>，以小寫 tagName 去重；同一元素可同時出現在多個教學分類，分類數量不可直接加總視為元素總數。</p><p><b>尚未確認為標準的候選元素：</b>無。本資料集沒有加入無法在該版索引找到的候選標籤。</p><p><b>教學細節尚待補充：</b>${REPORT.detailsPending.length} 個元素缺乏專屬的已撰寫範例；此為內容完成度限制，不是元素標準身分不明。</p><p>本網站不聲稱瀏覽器對每個元素的新功能都有相同程度支援；例如 selectedcontent 相關自訂選單應另做瀏覽器相容性測試。</p><p class="tiny">十四個分類由教學需要定義，不是 WHATWG 七大內容模型類別。由於某些元素在本教學分類之外具有額外用途，分類分配可再按課程目標調整。</p><a class="link" href="https://html.spec.whatwg.org/multipage/indices.html" target="_blank" rel="noopener">查看 WHATWG 原始索引 ↗</a>`;}
function csv(){let rows=[['tagName','description','categories','status','detailStatus','source'],...ELEMENTS.map(e=>[e.tagName,e.description,e.categories.join('；'),e.status,e.detailStatus,e.source])];return '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
activate();</script></body></html>
